[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "oscillink-safety-ops"
dynamic = ["version"]
description = "Oscillink Safety Ops is an independent safety and risk-mitigation supervisor for AI-controlled industrial equipment, connecting machine intent, observed behavior, and safety-manager oversight."
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "cryptography>=45,<47",
    "defusedxml>=0.7.1,<1",
    "pydantic>=2.11,<3",
]

[project.scripts]
safety-ops = "oscillink_safety_ops.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.138,<7",
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<1",
  "types-defusedxml>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oscillink_safety_ops"]

[tool.hatch.version]
path = "src/oscillink_safety_ops/__init__.py"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
