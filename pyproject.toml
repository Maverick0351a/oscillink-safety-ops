[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "oscillink-safety-ops"
version = "0.1.0"
description = "Read-only governed safety-memory auditing for physical intelligence"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = ["defusedxml>=0.7.1,<1", "pydantic>=2.11,<3"]

[project.scripts]
safety-ops = "oscillink_safety_ops.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-defusedxml>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oscillink_safety_ops"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
