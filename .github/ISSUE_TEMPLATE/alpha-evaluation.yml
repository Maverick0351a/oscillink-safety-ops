name: Private alpha evaluation interest
description: Express interest in a bounded, non-production evaluation using synthetic or sanitized evidence.
title: "alpha: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        This form records evaluation interest only. It does not create access, support, a pilot,
        certification, approval, or a production-use agreement. Do not submit confidential or
        regulated information.
  - type: dropdown
    id: perspective
    attributes:
      label: Evaluation perspective
      options:
        - Safety, compliance, or assurance
        - Physical-intelligence engineering or integration
        - Operations, maintenance, or OT ownership
        - Research or evaluation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Evaluation boundaries
      options:
        - label: I can begin with project-authored synthetic evidence.
          required: true
        - label: I understand Safety Ops does not determine compliance or authorize physical work.
          required: true
        - label: I will not submit customer, employee, facility, incident, credential, licensed-text, or hidden-evaluation data through GitHub.
          required: true
  - type: textarea
    id: question
    attributes:
      label: Evaluation question
      description: Describe the evidence or workflow question without identifying an organization, site, asset, or person.
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Useful evaluation result
      description: State what inspectable evidence would help evaluate the concept. Do not state a compliance or safety outcome.
    validations:
      required: true
