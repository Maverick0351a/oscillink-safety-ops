name: Bug report
description: Report reproducible deterministic behavior using synthetic data only.
title: "bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, customer or employee data, facility details, incident evidence,
        licensed standards text, private prompts, hidden tasks, or production-system exports.
        Report vulnerabilities through the private route in SECURITY.md, not this form.
  - type: checkboxes
    id: safety
    attributes:
      label: Submission boundary
      options:
        - label: I used only project-authored synthetic or permissively licensed evidence.
          required: true
        - label: This report does not request equipment control, compliance determination, certification, or work authorization.
          required: true
  - type: input
    id: version
    attributes:
      label: Exact commit SHA or version
      placeholder: 40-character commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide exact commands and synthetic input references.
      render: shell
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected contract behavior
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification output
      description: Include the result of `PYTHONPATH= uv run python scripts/verify.py` without environment secrets.
