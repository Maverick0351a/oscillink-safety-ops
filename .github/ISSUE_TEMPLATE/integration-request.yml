name: Read-only integration request
description: Propose a bounded evidence-reader adapter without a command path.
title: "integration: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Describe the source contract with synthetic examples only. Do not attach customer exports,
        credentials, internal addresses, facility data, licensed content, or production logs.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Required boundaries
      options:
        - label: The proposed integration is read-only and has no reverse command channel.
          required: true
        - label: Source bytes, normalization, review, and evaluation remain separate.
          required: true
        - label: Unknown, stale, missing, ambiguous, and unsupported evidence remains explicit.
          required: true
        - label: The request makes no compliance, certification, safe-operation, or production-readiness claim.
          required: true
  - type: input
    id: source
    attributes:
      label: Source-system class
      placeholder: File export, offline API snapshot, or other read-only source class
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence contract
      description: List source identity, revision, timing, quality, calibration, missing-field, and hash requirements.
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Fail-closed behavior
      description: Explain root containment, size bounds, changed bytes, malformed records, and unsupported fields.
    validations:
      required: true
  - type: textarea
    id: synthetic
    attributes:
      label: Synthetic fixture proposal
      description: Describe a project-authored fixture that can be committed and reproduced.
    validations:
      required: true
