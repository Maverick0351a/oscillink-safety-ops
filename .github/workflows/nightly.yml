name: Nightly assurance replay

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: TLC, property, fuzz corpus, and benchmark replay
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ""
      TLA_JAR_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          python-version: "3.11"
          enable-cache: true
      - name: Install pinned Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install locked development environment
        run: uv sync --locked --dev
      - name: Download and verify TLA tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --output tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          printf '%s  %s\n' "$TLA_JAR_SHA256" tla2tools.jar | sha256sum -c -
      - name: Replay exhaustive TLC model
        shell: bash
        run: uv run python scripts/verify_tla.py --check --java "$(command -v java)" --jar tla2tools.jar
      - name: Replay property tests
        run: uv run pytest tests/runtime/test_property_state_machine.py -q
      - name: Replay minimized fuzz corpus
        shell: bash
        run: uv run python fuzz/runtime_observation_fuzz.py fuzz/corpus/runtime/*.hex
      - name: Replay full synthetic benchmark
        run: uv run safety-ops benchmark verify --root benchmark/robot_cell_v1
      - name: Verify frozen benchmark and formal evidence
        run: uv run pytest tests/benchmark tests/test_verify_tla.py -q
