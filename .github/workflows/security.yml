name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Locked dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          python-version: "3.11"
          enable-cache: true
      - name: Install locked project environment
        run: uv sync --locked --no-dev
      - name: Audit locked runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv export --locked --no-dev --no-emit-project --no-hashes --output-file audit-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --strict --requirement audit-requirements.txt

  codeql:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: python
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:python
          upload: never

  gitleaks-history:
    name: Gitleaks full reachable history
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download and verify Gitleaks archive
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" "$url"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          mkdir -p .gitleaks-bin
          tar -xzf "$archive" -C .gitleaks-bin gitleaks
          test "$(.gitleaks-bin/gitleaks version)" = "$GITLEAKS_VERSION"
      - name: Scan every reachable commit with redacted output
        shell: bash
        run: |
          set -euo pipefail
          .gitleaks-bin/gitleaks git --redact --no-banner --report-format json --report-path gitleaks-redacted.json .
      - name: Upload redacted scanner evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-redacted-${{ github.sha }}
          path: gitleaks-redacted.json
          if-no-files-found: warn
          retention-days: 14
